name: Debug Avatar Studio

on:
  push:
    branches:
      - debug-avatar-studio-20260907
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: debug-avatar-studio-20260907

      - name: Inspect VRM materials
        run: python scripts/inspect_vrm_materials.py

      - name: Install dependencies
        run: npm ci

      - name: Rig check
        run: npm run check:rig

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
