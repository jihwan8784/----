name: Debug Avatar Studio

on:
  push:
    branches:
      - debug-avatar-studio-20260907
    paths:
      - .github/workflows/debug-avatar-studio.yml
      - scripts/apply_debug_fixes.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: debug-avatar-studio-20260907

      - name: Apply debugging fixes
        run: python scripts/apply_debug_fixes.py

      - name: Install dependencies
        run: npm ci

      - name: Rig check
        run: npm run check:rig

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit validated source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/tracking/tracker.ts src/lib/avatar/solver.ts src/lib/avatar/vrm.ts src/components/AvatarStudio.tsx
          git commit -m 'Fix camera switching, hand tracking, and VRM appearance handling'
          git push origin HEAD:debug-avatar-studio-20260907
