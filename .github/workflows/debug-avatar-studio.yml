name: Debug Avatar Studio

on:
  push:
    branches:
      - debug-avatar-studio-20260907
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: debug-avatar-studio-20260907

      - name: Inspect current VRM materials
        run: python scripts/inspect_vrm_materials.py

      - name: Inspect VTubeMe candidates
        run: python scripts/inspect_vtubeme_candidates.py

      - name: Upload candidate thumbnails
        uses: actions/upload-artifact@v4
        with:
          name: vtubeme-candidate-thumbnails
          path: candidate-thumbs
          if-no-files-found: warn

      - name: Install dependencies
        run: npm ci

      - name: Rig check
        run: npm run check:rig

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
