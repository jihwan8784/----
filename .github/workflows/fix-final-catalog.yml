name: Fix final avatar catalog

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-final-catalog.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Correct catalog source mapping and harden QA
        run: |
          python - <<'PY'
          from pathlib import Path

          avatar_path = Path('src/components/AvatarStudio.tsx')
          avatar = avatar_path.read_text()
          wrong = 'male: { url: "/avatars/occupation/male-student.vrm", match: "closest", note: "현실형 캐주얼 복장 · 얼굴 표정 지원", source: "valid", faceExpressions: true },'
          right = 'male: { url: "/avatars/realistic/male-casual.vrm", match: "closest", note: "현실형 캐주얼 복장 · 얼굴 표정 지원", source: "valid", faceExpressions: true },'
          count = avatar.count(wrong)
          if count != 2:
              raise SystemExit(f'Expected exactly two incorrect casual mappings, found {count}')
          avatar_path.write_text(avatar.replace(wrong, right))

          validator_path = Path('scripts/validate-vrm-assets.mjs')
          validator = validator_path.read_text()
          anchor = 'if (urls.length < 10) throw new Error(`Expected catalog VRM references, found only ${urls.length}`);\n\n'
          if anchor not in validator:
              raise SystemExit('Could not locate asset-validator catalog anchor')
          guard = '''for (const line of source.split(/\\r?\\n/)) {
            if (!line.includes('url: "/avatars/')) continue;
            if (line.includes('source: "valid"') && line.includes('/avatars/occupation/')) {
              throw new Error(`Catalog source mismatch: VALID profile points to occupation asset: ${line.trim()}`);
            }
            if (line.includes('source: "rocketbox"') && line.includes('/avatars/realistic/')) {
              throw new Error(`Catalog source mismatch: Rocketbox profile points to VALID asset: ${line.trim()}`);
            }
          }

          '''
          if 'Catalog source mismatch:' not in validator:
              validator = validator.replace(anchor, anchor + guard, 1)
          validator_path.write_text(validator)
          PY

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete validation
        run: |
          set -euo pipefail
          npm run check:rig
          npm run check:assets
          npm run lint
          npm run build

      - name: Commit corrections
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AvatarStudio.tsx scripts/validate-vrm-assets.mjs
          git commit -m 'Correct final avatar catalog mappings'
          git push origin HEAD:main
