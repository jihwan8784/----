name: Flatten Avatar Studio folders

on:
  push:
    branches:
      - flatten-main-20260907
    paths:
      - .github/workflows/flatten-folders.yml

permissions:
  contents: write

jobs:
  flatten-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Flatten source, assets, and test folders
        run: |
          set -euo pipefail
          mkdir -p src/core

          git mv src/components/AvatarStudio.tsx src/AvatarStudio.tsx
          git mv src/lib/avatar/expressions.ts src/core/face-expressions.ts
          git mv src/lib/avatar/rig.ts src/core/avatar-rig.ts
          git mv src/lib/avatar/solver.ts src/core/motion-solver.ts
          git mv src/lib/avatar/vrm-loader.ts src/core/vrm-loader.ts
          git mv src/lib/scene/avatar-scene-viewer.ts src/core/scene-viewer.ts
          git mv src/lib/studio-settings-store.ts src/core/settings.ts
          git mv src/lib/tracking-types.ts src/core/types.ts
          git mv src/lib/tracking/landmarks.ts src/core/tracking-landmarks.ts
          git mv src/lib/tracking/overlay.ts src/core/tracking-overlay.ts
          git mv src/lib/tracking/smoothing.ts src/core/tracking-smoothing.ts
          git mv src/lib/tracking/tracker.ts src/core/tracking-engine.ts
          git mv scripts/fixtures/mannequin.ts scripts/test-mannequin.ts

          rmdir src/components src/lib/avatar src/lib/scene src/lib/tracking src/lib scripts/fixtures

          for f in public/avatars/google-valid/*.vrm; do
            base="$(basename "$f")"
            git mv "$f" "public/avatars/valid-$base"
          done
          git mv public/avatars/google-valid/LICENSE_AND_SOURCE.md public/avatars/LICENSE_GOOGLE_VALID.md
          rmdir public/avatars/google-valid

          for f in public/avatars/microsoft-rocketbox/*.vrm; do
            base="$(basename "$f")"
            git mv "$f" "public/avatars/rocketbox-$base"
          done
          git mv public/avatars/microsoft-rocketbox/LICENSE_AND_SOURCE.md public/avatars/LICENSE_MICROSOFT_ROCKETBOX.md
          rmdir public/avatars/microsoft-rocketbox

          git mv public/backgrounds/ai-stage.png public/background-ai-stage.png
          git mv public/backgrounds/ai-stage-thumb.jpg public/background-ai-stage-thumb.jpg
          git mv public/backgrounds/neon-city.png public/background-neon-city.png
          git mv public/backgrounds/neon-city-thumb.jpg public/background-neon-city-thumb.jpg
          git mv public/backgrounds/busan-future.png public/background-busan-future.png
          git mv public/backgrounds/busan-future-thumb.jpg public/background-busan-future-thumb.jpg
          rmdir public/backgrounds

      - name: Update imports and public paths
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '@/components/AvatarStudio': '@/AvatarStudio',
              '@/lib/avatar/expressions': '@/core/face-expressions',
              '@/lib/avatar/rig': '@/core/avatar-rig',
              '@/lib/avatar/solver': '@/core/motion-solver',
              '@/lib/avatar/vrm-loader': '@/core/vrm-loader',
              '@/lib/scene/avatar-scene-viewer': '@/core/scene-viewer',
              '@/lib/studio-settings-store': '@/core/settings',
              '@/lib/tracking-types': '@/core/types',
              '@/lib/tracking/landmarks': '@/core/tracking-landmarks',
              '@/lib/tracking/overlay': '@/core/tracking-overlay',
              '@/lib/tracking/smoothing': '@/core/tracking-smoothing',
              '@/lib/tracking/tracker': '@/core/tracking-engine',
              '../src/lib/avatar/solver': '../src/core/motion-solver',
              '../src/lib/tracking/landmarks': '../src/core/tracking-landmarks',
              '../src/lib/tracking-types': '../src/core/types',
              './fixtures/mannequin': './test-mannequin',
              '../../src/lib/avatar/rig': '../src/core/avatar-rig',
              '/avatars/google-valid/': '/avatars/valid-',
              '/avatars/microsoft-rocketbox/': '/avatars/rocketbox-',
              '/backgrounds/ai-stage.png': '/background-ai-stage.png',
              '/backgrounds/ai-stage-thumb.jpg': '/background-ai-stage-thumb.jpg',
              '/backgrounds/neon-city.png': '/background-neon-city.png',
              '/backgrounds/neon-city-thumb.jpg': '/background-neon-city-thumb.jpg',
              '/backgrounds/busan-future.png': '/background-busan-future.png',
              '/backgrounds/busan-future-thumb.jpg': '/background-busan-future-thumb.jpg',
          }

          for root in [Path('src'), Path('scripts')]:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.mts', '.mjs'}:
                      continue
                  text = path.read_text()
                  for old, new in replacements.items():
                      text = text.replace(old, new)
                  path.write_text(text)

          relative_fixes = {
              'src/core/face-expressions.ts': {'"./rig"': '"./avatar-rig"'},
              'src/core/motion-solver.ts': {'"./rig"': '"./avatar-rig"', '"@/core/tracking-smoothing"': '"./tracking-smoothing"'},
              'src/core/vrm-loader.ts': {'"./rig"': '"./avatar-rig"'},
              'src/core/tracking-engine.ts': {'"./landmarks"': '"./tracking-landmarks"', '"./smoothing"': '"./tracking-smoothing"'},
              'src/core/tracking-overlay.ts': {'"./landmarks"': '"./tracking-landmarks"'},
          }
          for filename, fixes in relative_fixes.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in fixes.items():
                  text = text.replace(old, new)
              path.write_text(text)

          studio = Path('src/AvatarStudio.tsx')
          text = studio.read_text()
          text = text.replace(
              's.vrmUrl?.startsWith("/avatars/google-valid/") ||\n    s.vrmUrl?.startsWith("/avatars/microsoft-rocketbox/")',
              's.vrmUrl?.startsWith("/avatars/")',
          )
          studio.write_text(text)
          PY

      - name: Update avatar validator and documentation
        run: |
          cat > scripts/validate-avatar-files.mjs <<'EOF'
          #!/usr/bin/env node
          import fs from "node:fs";
          import path from "node:path";

          const root = process.cwd();
          const requiredBones = new Set([
            "hips", "spine", "chest", "neck", "head",
            "leftShoulder", "leftUpperArm", "leftLowerArm", "leftHand",
            "rightShoulder", "rightUpperArm", "rightLowerArm", "rightHand",
            "leftUpperLeg", "leftLowerLeg", "leftFoot",
            "rightUpperLeg", "rightLowerLeg", "rightFoot",
          ]);

          function readVrm(file) {
            const data = fs.readFileSync(file);
            if (data.toString("ascii", 0, 4) !== "glTF") throw new Error(`${file}: not a binary glTF/VRM file`);
            if (data.readUInt32LE(4) !== 2) throw new Error(`${file}: expected glTF 2.0`);
            const jsonLength = data.readUInt32LE(12);
            if (data.readUInt32LE(16) !== 0x4e4f534a) throw new Error(`${file}: first chunk is not JSON`);
            return { data, json: JSON.parse(data.subarray(20, 20 + jsonLength).toString("utf8").trimEnd()) };
          }

          function humanoidBoneNames(json, relative) {
            const vrm1 = json.extensions?.VRMC_vrm;
            if (vrm1) return { version: "1.0", names: new Set(Object.keys(vrm1.humanoid?.humanBones ?? {})) };
            const vrm0 = json.extensions?.VRM;
            if (vrm0) return {
              version: "0.x",
              names: new Set((vrm0.humanoid?.humanBones ?? []).map((entry) => entry?.bone).filter(Boolean)),
            };
            throw new Error(`${relative}: missing VRMC_vrm/VRM extension`);
          }

          function validateHumanoid(url, requireMorphs) {
            const file = path.join(root, "public", url.replace(/^\//, ""));
            if (!fs.existsSync(file)) throw new Error(`${url}: missing file`);
            const { data, json } = readVrm(file);
            const humanoid = humanoidBoneNames(json, url);
            const missing = [...requiredBones].filter((bone) => !humanoid.names.has(bone));
            if (missing.length) throw new Error(`${url}: missing humanoid bones: ${missing.join(", ")}`);
            if (!json.skins?.length) throw new Error(`${url}: no skin`);
            if (!json.materials?.length) throw new Error(`${url}: no materials`);
            const primitives = (json.meshes ?? []).flatMap((mesh) => mesh.primitives ?? []);
            if (!primitives.length) throw new Error(`${url}: no mesh primitives`);
            if (!primitives.some((p) => p.attributes?.JOINTS_0 !== undefined && p.attributes?.WEIGHTS_0 !== undefined)) {
              throw new Error(`${url}: no JOINTS_0/WEIGHTS_0`);
            }
            const morphCount = primitives.reduce((sum, p) => sum + (p.targets?.length ?? 0), 0);
            if (requireMorphs && morphCount === 0) throw new Error(`${url}: expected facial morph targets but found none`);
            console.log(`OK ${url} (VRM ${humanoid.version}, ${(data.length / 1024 / 1024).toFixed(2)} MB, morphTargets=${morphCount})`);
          }

          const source = fs.readFileSync(path.join(root, "src/AvatarStudio.tsx"), "utf8");
          const urls = [...new Set([...source.matchAll(/\/avatars\/(?:valid|rocketbox)-[a-z-]+\.vrm/g)].map((m) => m[0]))];
          if (urls.length < 10) throw new Error(`Expected catalog VRM references, found only ${urls.length}`);

          for (const line of source.split(/\r?\n/)) {
            if (!line.includes('url: "/avatars/')) continue;
            if (line.includes('source: "valid"') && !line.includes('/avatars/valid-')) throw new Error(`VALID source mismatch: ${line.trim()}`);
            if (line.includes('source: "rocketbox"') && !line.includes('/avatars/rocketbox-')) throw new Error(`Rocketbox source mismatch: ${line.trim()}`);
          }

          for (const url of urls) validateHumanoid(url, url.startsWith("/avatars/valid-"));

          for (const notice of ["public/avatars/LICENSE_GOOGLE_VALID.md", "public/avatars/LICENSE_MICROSOFT_ROCKETBOX.md"]) {
            if (!fs.existsSync(path.join(root, notice))) throw new Error(`Missing license notice: ${notice}`);
          }

          console.log(`Validated ${urls.length} catalog VRM references.`);
          EOF

          cat > public/avatars/README.md <<'EOF'
          # Built-in avatar files

          모든 내장 VRM은 이 폴더 하나에 있습니다. 파일 이름만 보고 출처와 용도를 알 수 있게 정리했습니다.

          - `valid-*.vrm`: Google VALID / TLTMedia 기반 현실형 VRM (CC BY 4.0)
          - `rocketbox-*.vrm`: Microsoft Rocketbox 기반 직업형 VRM (MIT)
          - `LICENSE_GOOGLE_VALID.md`: Google VALID 계열 출처/라이선스
          - `LICENSE_MICROSOFT_ROCKETBOX.md`: Rocketbox 계열 출처/라이선스

          예: `valid-male-medical.vrm`, `rocketbox-female-firefighter.vrm`, `rocketbox-male-pilot-for-astronaut.vrm`.
          EOF

          cat > README.md <<'EOF'
          # AI Korea Avatar Studio

          웹캠으로 전신과 손을 추적하고 현실형 VRM 아바타에 실시간으로 적용하는 전시용 웹 앱입니다.

          ## 실행

          ```bash
          npm install
          npm run dev
          ```

          카메라는 `localhost` 또는 HTTPS에서 사용할 수 있습니다.

          ## 파일 구조

          ```text
          src/
            AvatarStudio.tsx       # 메인 스튜디오 UI/카메라/촬영
            app/                   # Next.js 페이지와 /embed 라우트
            core/                  # 추적, VRM, 렌더링 핵심 코드
          public/
            avatars/               # 모든 VRM과 라이선스
            background-*.png/jpg   # 전시 배경
          scripts/
            prepare-mediapipe-wasm.mjs
            test-avatar-tracking.mts
            test-mannequin.ts
            validate-avatar-files.mjs
          ```

          `src/core`는 하위 폴더를 다시 만들지 않고 한 곳에 모았습니다. 파일 이름으로 역할을 바로 알 수 있습니다.

          - `tracking-*`: MediaPipe 추적
          - `avatar-rig.ts`, `motion-solver.ts`: 아바타 뼈/움직임
          - `face-expressions.ts`: 얼굴 표정
          - `vrm-loader.ts`: VRM 로딩
          - `scene-viewer.ts`: Three.js 렌더링
          - `settings.ts`: 스튜디오 설정
          - `types.ts`: 공용 타입

          ## 검사

          ```bash
          npm run check:tracking
          npm run check:avatars
          npm run lint
          npm run build
          ```

          GitHub Actions의 `Avatar Studio CI`도 같은 검사를 자동 실행합니다.
          EOF

      - name: Reject stale folder references
        run: |
          if grep -R -nE '@/lib/|@/components/|/avatars/(google-valid|microsoft-rocketbox)/|/backgrounds/' src scripts README.md public/avatars/README.md; then
            echo 'Old folder references remain.' >&2
            exit 1
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tracking, avatars, lint, and build
        run: |
          npm run check:tracking
          npm run check:avatars
          npm run lint
          npm run build

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/flatten-folders.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Flatten project folders without changing behavior'
          git push origin HEAD:flatten-main-20260907
