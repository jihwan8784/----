name: Apply realistic avatar catalog

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-realistic-avatar-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply realistic catalog
        run: python scripts/apply_realistic_catalog.py

      - name: Remove replaced generated avatars
        run: |
          rm -rf public/avatars/project
          rm -f .github/workflows/import-realistic-vrms.yml

      - name: Install dependencies
        run: npm ci

      - name: Check tracking rig
        run: npm run check:rig

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use licensed realistic VRMs in avatar options'
          git push origin HEAD:main
