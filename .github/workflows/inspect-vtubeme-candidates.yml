name: Inspect VTubeMe candidates

on:
  push:
    branches:
      - replace-avatar-library-20260907
    paths:
      - .github/workflows/inspect-vtubeme-candidates.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download ready-made VRM candidates
        run: |
          set -euo pipefail
          mkdir -p /tmp/vrm-candidates
          for name in nova kai sky ember; do
            curl -fL --retry 3 "https://vtubeme.com/media/free/${name}/model.vrm" -o "/tmp/vrm-candidates/${name}.vrm"
          done

      - name: Inspect gender-coded asset names
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, struct, re

          for path in sorted(Path('/tmp/vrm-candidates').glob('*.vrm')):
              data = path.read_bytes()
              off = 12
              doc = None
              while off + 8 <= len(data):
                  size, typ = struct.unpack_from('<II', data, off)
                  off += 8
                  chunk = data[off:off+size]
                  off += size
                  if typ == 0x4E4F534A:
                      doc = json.loads(chunk.rstrip(b'\x00 \t\r\n').decode())
                      break
              assert doc
              names = []
              for key in ('nodes', 'meshes', 'materials', 'images', 'textures'):
                  for item in doc.get(key, []):
                      for field in ('name', 'uri'):
                          value = item.get(field)
                          if value:
                              names.append(f'{key}:{field}:{value}')
              matches = [x for x in names if re.search(r'(^|[^a-z])(male|female|man|woman|boy|girl)([^a-z]|$)', x, re.I)]
              print(f'=== {path.name} ===')
              print('gender-coded names:', matches)
              print('image names:', [x for x in names if x.startswith('images:')])
          PY
