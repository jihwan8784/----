name: Inspect VTubeMe candidates

on:
  push:
    branches:
      - replace-avatar-library-20260907
    paths:
      - .github/workflows/inspect-vtubeme-candidates.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Download ready-made VRM candidates
        run: |
          set -euo pipefail
          mkdir -p /tmp/vrm-candidates
          curl -fL --retry 3 https://vtubeme.com/media/free/nova/model.vrm -o /tmp/vrm-candidates/nova.vrm
          curl -fL --retry 3 https://vtubeme.com/media/free/kai/model.vrm -o /tmp/vrm-candidates/kai.vrm
          curl -fL --retry 3 https://vtubeme.com/media/free/sky/model.vrm -o /tmp/vrm-candidates/sky.vrm
          curl -fL --retry 3 https://vtubeme.com/media/free/ember/model.vrm -o /tmp/vrm-candidates/ember.vrm
          ls -lh /tmp/vrm-candidates

      - name: Inspect VRM metadata and structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, struct

          def glb_json(path: Path):
              data = path.read_bytes()
              if data[:4] != b'glTF':
                  raise RuntimeError(f'{path.name}: not GLB/VRM')
              version, total = struct.unpack_from('<II', data, 4)
              off = 12
              js = None
              while off + 8 <= len(data):
                  size, typ = struct.unpack_from('<II', data, off)
                  off += 8
                  chunk = data[off:off+size]
                  off += size
                  if typ == 0x4E4F534A:
                      js = json.loads(chunk.rstrip(b'\x00 \t\r\n').decode('utf-8'))
                      break
              if js is None:
                  raise RuntimeError(f'{path.name}: no JSON chunk')
              return version, total, js

          for path in sorted(Path('/tmp/vrm-candidates').glob('*.vrm')):
              version, total, doc = glb_json(path)
              ext = doc.get('extensions', {})
              meta1 = ext.get('VRMC_vrm', {}).get('meta', {})
              meta0 = ext.get('VRM', {}).get('meta', {})
              meta = meta1 or meta0
              vrm_version = '1.0' if 'VRMC_vrm' in ext else ('0.x' if 'VRM' in ext else 'unknown')
              humanoid = ext.get('VRMC_vrm', {}).get('humanoid', {}) or ext.get('VRM', {}).get('humanoid', {})
              human_bones = humanoid.get('humanBones', {})
              if isinstance(human_bones, list):
                  bone_names = [x.get('bone') for x in human_bones]
              else:
                  bone_names = list(human_bones.keys())
              blob = json.dumps(doc, ensure_ascii=False).lower()
              gender_terms = [term for term in ['gender','female','male','woman','man','girl','boy'] if term in blob]
              print('\n===', path.name, '===')
              print('size_mb:', round(total/1024/1024, 2), 'glb_version:', version, 'vrm_version:', vrm_version)
              print('meta:', json.dumps(meta, ensure_ascii=False, indent=2)[:5000])
              print('gender_terms_found_in_json:', gender_terms)
              print('nodes:', len(doc.get('nodes', [])), 'meshes:', len(doc.get('meshes', [])), 'materials:', len(doc.get('materials', [])), 'images:', len(doc.get('images', [])))
              print('humanoid_bones:', bone_names)
              print('material_names:', [m.get('name') for m in doc.get('materials', [])][:80])
              print('mesh_names:', [m.get('name') for m in doc.get('meshes', [])][:80])
          PY
