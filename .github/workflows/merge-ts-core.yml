name: Merge TypeScript core

on:
  push:
    branches:
      - merge-ts-core-20260907

permissions:
  contents: write

jobs:
  merge-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out merge branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Merge TypeScript core
        run: node scripts/merge-ts-core.mjs

      - name: Check simplified TypeScript layout
        run: |
          test -f src/core.ts
          test ! -d src/core
          test ! -f scripts/test-mannequin.ts
          test ! -f next.config.ts
          test -f next.config.mjs
          mapfile -t ts_files < <(find . -path './node_modules' -prune -o -path './.next' -prune -o -type f -name '*.ts' ! -name '*.d.ts' -print | sort)
          printf 'Regular .ts files:\n%s\n' "${ts_files[*]}"
          test "${#ts_files[@]}" -eq 1
          test "${ts_files[0]}" = './src/core.ts'

      - name: Test full-body tracking and wrist regression
        run: npm run check:tracking

      - name: Validate built-in avatar files
        run: npm run check:avatars

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Remove one-time migration files
        run: |
          rm -f scripts/merge-ts-core.mjs
          rm -f .github/workflows/merge-ts-core.yml

      - name: Commit validated TypeScript merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Merge TypeScript core into one file'
          git push origin HEAD:merge-ts-core-20260907
