name: Apply ready-made VRM replacement

on:
  push:
    branches:
      - replace-avatar-library-20260907
    paths:
      - .github/workflows/apply-ready-made-vrm-replacement.yml

permissions:
  contents: write

jobs:
  replace-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out replacement branch
        uses: actions/checkout@v4

      - name: Replace discarded avatars with original VRMs
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch public/avatars/google-valid
          git rm -r --ignore-unmatch public/avatars/microsoft-rocketbox
          git rm -r --ignore-unmatch research-previews
          mkdir -p public/avatars/vtubeme
          curl -fL --retry 3 https://vtubeme.com/media/free/nova/model.vrm -o public/avatars/vtubeme/male-student-vtubeme-nova.vrm
          curl -fL --retry 3 https://vtubeme.com/media/free/kai/model.vrm -o public/avatars/vtubeme/female-student-vtubeme-kai.vrm
          cat > public/avatars/vtubeme/LICENSE_AND_SOURCE.md <<'EOF'
          # VTubeMe ready-made VRM attribution

          These files are original ready-made `.vrm` downloads from VTubeMe. This repository does not convert, rebuild, or generate them.

          - `male-student-vtubeme-nova.vrm`
            - Source page: https://vtubeme.com/free-vrm-avatars/nova
            - Original VRM: https://vtubeme.com/media/free/nova/model.vrm
          - `female-student-vtubeme-kai.vrm`
            - Source page: https://vtubeme.com/free-vrm-avatars/kai
            - Original VRM: https://vtubeme.com/media/free/kai/model.vrm

          License: Creative Commons Attribution 4.0 (CC BY 4.0). Credit VTubeMe and link to the source when redistributing.

          The male/female labels are this project's UI categorization of the avatar presentation. The public model pages and VRM metadata do not expose a separate gender field.
          EOF

      - name: Commit replacement assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/avatars research-previews || true
          git commit -m 'Replace discarded avatar assets with original VRMs'
          git push origin HEAD:replace-avatar-library-20260907
