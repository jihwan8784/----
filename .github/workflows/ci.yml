name: Avatar Studio CI

on:
  push:
    branches:
      - main
      - occupation-avatar-upgrade-20260907
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tracking rig and wrist regression
        run: npm run check:rig

      - name: Validate bundled VRM assets
        run: npm run check:assets

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
