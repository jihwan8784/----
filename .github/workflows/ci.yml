name: Avatar Studio CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test full-body tracking and wrist regression
        run: npm run check:tracking

      - name: Validate built-in avatar files
        run: npm run check:avatars

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
