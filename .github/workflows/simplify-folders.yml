name: Simplify repository folders

on:
  push:
    branches:
      - simplify-folders-20260907

permissions:
  contents: write

jobs:
  simplify-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4

      - name: Simplify folders and filenames
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/simplify-repository.py')
          text = p.read_text()
          text = text.replace('@/' + 'core/avatar/mannequin', '@/' + 'lib/avatar/mannequin')
          text = text.replace(
              "if path.name == 'simplify-repository.py':",
              "if path.name in {'simplify-repository.py', 'simplify-folders.yml'}:",
          )
          text = text.replace(
              "if not path.is_file() or path.suffix not in text_suffixes or path.name == 'simplify-repository.py':",
              "if not path.is_file() or path.suffix not in text_suffixes or path.name in {'simplify-repository.py', 'simplify-folders.yml'}:",
          )
          p.write_text(text)
          PY
          python scripts/simplify-repository.py

          python - <<'PY'
          from pathlib import Path
          fixes = {
              'src/core/face-expressions.ts': {'"./rig"': '"./avatar-rig"'},
              'src/core/motion-solver.ts': {'"./rig"': '"./avatar-rig"'},
              'src/core/vrm-loader.ts': {'"./rig"': '"./avatar-rig"'},
              'src/core/tracking-engine.ts': {
                  '"./landmarks"': '"./tracking-landmarks"',
                  '"./smoothing"': '"./tracking-smoothing"',
              },
              'src/core/tracking-overlay.ts': {'"./landmarks"': '"./tracking-landmarks"'},
              'scripts/test-mannequin.ts': {'"./rig"': '"../src/core/avatar-rig"'},
          }
          for filename, replacements in fixes.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate simplified project
        run: |
          npm run check:rig
          npm run check:assets
          npm run lint
          npm run build

      - name: Remove one-time migration files
        run: |
          rm -f scripts/simplify-repository.py
          rm -f .github/workflows/simplify-folders.yml

      - name: Commit validated cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify project folders and filenames'
          git push origin HEAD:simplify-folders-20260907
