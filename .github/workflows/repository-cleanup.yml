name: Repository cleanup

on:
  push:
    branches:
      - repository-cleanup-20260907
    paths:
      - .github/workflows/repository-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4

      - name: Apply cleanup
        run: python scripts/repository-cleanup.py

      - name: Keep workflow files unchanged for the bot push
        run: git checkout HEAD -- .github/workflows/ci.yml .github/workflows/repository-cleanup.yml

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test full-body tracking
        run: npm run check:tracking

      - name: Validate avatar files
        run: npm run check:avatars

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Remove one-time cleanup script
        run: git rm scripts/repository-cleanup.py

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean up Avatar Studio files and names'
          git push origin HEAD:repository-cleanup-20260907
